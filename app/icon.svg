<!--
  The StackChips favicon.

  Deliberately NOT the full "High Roller Arcade" badge from
  public/brand/stackchips-logo.png. That mark carries a card fan, a banner and
  two lines of type; at the 16-32px a favicon actually renders it collapses
  into a smudge -- the same lesson components/arcade/dealer-avatar.tsx records
  about judging a mark at its rendered size rather than in its viewBox.

  What survives the shrink is the badge's one unmistakable element: the
  purple -> gold -> red arc sweeping over a card. So that is all this draws,
  in the mark's own sampled colours (#983fe0 / #db9c0b / #dc1413).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#983fe0"/>
      <stop offset=".48" stop-color="#db9c0b"/>
      <stop offset="1" stop-color="#dc1413"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c94a"/>
      <stop offset="1" stop-color="#b48918"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0a0710"/>

  <!-- The arc, struck well clear of the card so it still reads as a ring
       rather than an outline once both are only a few pixels tall. -->
  <path d="M84 300a172 172 0 0 1 344 0" fill="none" stroke="url(#sweep)"
        stroke-width="26" stroke-linecap="round"/>

  <!-- One card, tilted the way the fan's leading ace is. -->
  <g transform="rotate(-9 256 300)">
    <rect x="176" y="196" width="160" height="222" rx="26" fill="#fefefe"/>
    <!-- Spade, gold: the badge's ace-of-spades pip. -->
    <path d="M256 240c0 0-58 44-58 78a30 30 0 0 0 52 21l-10 39h32l-10-39a30 30 0 0 0 52-21c0-34-58-78-58-78z"
          fill="url(#gold)"/>
  </g>
</svg>
